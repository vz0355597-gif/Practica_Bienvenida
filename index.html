<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carta de Bienvenida Corporativa</title>
    <style>
        :root {
            --primary: #0f2c59;
            --secondary: #337ccf;
            --bg: #f4f6f9;
        }
        body {
    font-family: 'Georgia', 'Times New Roman', serif; 
    background-color: var(--bg);
    color: #2b2b2b;
    margin: 0;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
        }
        main {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }
        .carta {
            background: #fff;
            width: 100%;
            max-width: 750px;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            border-top: 6px solid var(--primary);
        }
        /* Logo alineado*/
        .header-logo {
            text-align: right;
            margin-bottom: 10px;
        }
        .header-logo img {
            width: 55px;
            height: 55px;
            object-fit: contain;
        }
        .divider {
            border: none;
            border-top: 1px solid #eaeaea;
            margin-bottom: 20px;
        }
        /* Fecha alineada*/
        .fecha-box {
            text-align: right;
            font-size: 14px;
            color: #555;
            margin-bottom: 25px;
        }
        .carta h2 {
            color: var(--primary);
            margin-top: 0;
            border-bottom: 2px solid #eaeaea;
            padding-bottom: 12px;
        }
        .info-destinatario {
            background: #f8fafc;
            border-left: 4px solid var(--secondary);
            padding: 12px 18px;
            margin: 20px 0;
        }
        .texto-mensaje {
            line-height: 1.8;
            color: #4b5563;
            text-align: justify;
            margin: 20px 0;
        }
        .firma {
            margin-top: 40px;
            border-top: 1px solid #eaeaea;
            padding-top: 20px;
        }
        .firma p { margin: 4px 0; }
        .nombre-firma {
            font-weight: bold;
            color: var(--primary);
        }
        footer {
            background: var(--primary);
            color: #fff;
            text-align: center;
            padding: 20px;
            font-size: 13px;
        }
        footer p { margin: 4px 0; }
    </style>
</head>
<body>

    <main>
        <div class="carta">
    <!-- Encabezado con Logo -->
    <div style="display: flex; justify-content: flex-end; align-items: center; gap: 15px; margin-bottom: 10px;">
    <h2 id="empresa-nombre" style="color: #0f2c59; margin: 0; font-size: 20px; text-align: right;">Univive S.A. de C.V.</h2>
    <div class="header-logo" style="margin: 0;">
        <img id="logo" src="logo.jpeg" alt="Logo" style="width: 50px; height: 50px; object-fit: contain;">
    </div>
</div>
<hr class="divider">
    <!-- Fecha -->
    <div class="fecha-box" id="fecha">
        Ciudad de México, 27 de septiembre de 2026
    </div>
            
            <div class="info-destinatario">
                <p><strong>A quien va dirigido:</strong> <span id="destinatario"></span></p>
                <p><strong>Puesto:</strong> <span id="puesto"></span> 
                <p></p>   <strong>Departamento:</strong> <span id="depto"></span></p>
            </div>

            <div class="texto-mensaje">
    <!-- El saludo-->
    <p id="saludo" style="font-family: 'Georgia', serif; font-style: italic; font-weight: bold; font-size: 16px; color: #111; margin-bottom: 15px;"></p>
    
    <!-- El cuerpo del mensaje abajo -->
    <p id="mensaje"></p>
</div>

            <div class="firma">
    <p>Atentamente,</p>
    <!-- AQUÍ AGREGAMOS LA IMAGEN DE LA FIRMA -->
    <div>
        <img id="firma-img" src="marcela.jpg" alt="Firma" style="max-height: 50px; margin: 5px 0; object-fit: contain;">
    </div>
    <p class="nombre-firma" id="remitente"></p>
    <p id="cargo" style="color: #6b7280; font-size: 14px;"></p>
</div>
                <p class="nombre-firma" id="remitente"></p>
                <p id="cargo" style="color: #6b7280; font-size: 14px;"></p>
            </div>
        </div>
    </main>

    <footer>
        <p id="f-nombre"></p>
        <p id="f-dir"></p>
        <p id="f-cont"></p>
    </footer>

    <script>
        // Esta es la línea clave del fetch que puedes borrar y volver a pegar en tu presentación
       fetch('http://localhost:3000/api/bienvenida/json')
        .then(res => res.json())
        .then(data => {
            document.getElementById('logo').src = 'logo.jpeg';
            
            // Aquí lee el nombre de la empresa que te está mandando tu server.js
            // (Asegúrate de cambiar 'nombre' por la variable exacta que tenga tu JSON, ej: data.empresa.nombre o data.nombre)
            document.getElementById('empresa-nombre').textContent = data.empresa.nombre || 'Univive S.A. de C.V.';
            
            if(data.bienvenida.fecha) {
                document.getElementById('fecha').textContent = data.bienvenida.fecha;
            }
            
            // Limpiamos el título profesional (Ing., Lic., etc.) para agarrar únicamente tu nombre
let nombreCompleto = data.bienvenida.destinatario || '';
let nombreLimpio = nombreCompleto.replace(/^(Ing\.|Lic\.|Dr\.|Mtro\.|C\.)\s*/i, '');
let primerNombre = nombreLimpio.split(' ')[0] || 'Vanessa';

            document.getElementById('destinatario').textContent = data.bienvenida.destinatario || '';
            document.getElementById('puesto').textContent = data.bienvenida.puesto || '';
            document.getElementById('depto').textContent = data.bienvenida.departamento || '';
            document.getElementById('saludo').textContent = "Estimado(a) " + primerNombre + ":";
            document.getElementById('mensaje').textContent = data.bienvenida.mensaje || '';
            document.getElementById('remitente').textContent = data.bienvenida.remitente || '';
            document.getElementById('cargo').textContent = data.bienvenida.cargoRemitente || '';
        })
        .catch(err => console.error("Error:", err));
    </script>
</body>
</html>
